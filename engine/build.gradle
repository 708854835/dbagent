dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.17.2'
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
    // 本系统 Schema 缓存拉取（information_schema）
    implementation 'com.mysql:mysql-connector-j:8.4.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jar {
    archiveBaseName = 'engine'
    archiveVersion = ''
    manifest {
        attributes 'Main-Class': 'com.dbagent.engine.cli.EngineCli'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// 演示入口：java -jar engine/build/libs/engine.jar generate --input form.json --output result.json

// 部署包：dbagent-engine.zip（bin/ 启动脚本 + config/ 规则与字典 + lib/ fat jar + data/ + logs/）
tasks.register('distZip', Zip) {
    dependsOn jar
    archiveBaseName = 'dbagent-engine'
    archiveVersion = ''
    destinationDirectory = layout.buildDirectory.dir('distributions')
    includeEmptyDirs = true
    into('dbagent-engine') {
        into('bin') {
            from('src/dist/bin') {
                include 'start.sh'
                filePermissions { unix('rwxr-xr-x') }
            }
            from('src/dist/bin') {
                include 'start.bat'
            }
        }
        into('config') {
            from('../config')
        }
        into('lib') {
            from(jar)
        }
        into('data') {
            from('src/dist/data')
        }
        into('logs') {
            from('src/dist/logs')
        }
    }
}
